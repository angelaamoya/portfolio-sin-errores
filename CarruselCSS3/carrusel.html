<!DOCTYPE html>
<html lang="es">

<head>
    <title>Carrusel de imágenes con CSS3</title>
    <meta charset="utf-8">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
</head>

<body>

    <section id="carrusel">
        <h2>Carrusel de imágenes</h2>
        <!-- Son necesarios dos divs porque uno tendrá lo que se muestre y el otro será el que contenga todas las imágenes que vayan pasando -->
        <!-- Para que quede bien y no aparezcan unas imágenes más grandes que otras, o las elegimos con la misma relación de aspecto, o ajustamos al alto de las imágenes en vez de al ancho -->
        <div>
            <div>
                <figure>
                    <img src="img/foto1.jpg" alt="">
                </figure>
                <figure>
                    <img src="img/foto2.jpg" alt="">
                </figure>
                <figure>
                    <img src="img/foto3.jpg" alt="">
                </figure>
            </div>
        </div>
    </section>
</body></html>
